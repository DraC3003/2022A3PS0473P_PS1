<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .nav-buttons {
            margin-bottom: 20px;
        }
        .nav-buttons a {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 10px;
        }
        .nav-buttons a:hover {
            background-color: #0056b3;
        }
        .header-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-buttons">
            <a href="{{ url_for('consultations') }}">View Consultation History</a>
        </div>
        
        <h1>Diabetes Prediction System</h1>
        
        <div class="header-info">
            <p><strong>Doctor Consultation System</strong></p>
            <p>Enter patient factors below to predict diabetes risk. All consultations are stored in the database for future reference and analysis.</p>
        </div>
        
        <form action="/predict" method="post">
            {% for feature in feature_names %}
                <div class="form-group">
                    <label for="{{ feature }}">{{ feature.replace('_', ' ').title() }}:</label>
                    <input type="number" id="{{ feature }}" name="{{ feature }}" step="any" required>
                </div>
            {% endfor %}
            <button type="submit">Predict</button>
        </form>
    </div>
</body>
</html>
